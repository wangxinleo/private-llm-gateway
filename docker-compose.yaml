services:
  privacy-proxy:
    image: ghcr.io/wangxinleo/private-llm-gateway:latest
    container_name: privacy-proxy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # 从仓库根 .env 自动插值(docker compose 读取同目录 .env);留空/注释掉 UPSTREAM_URL
      # 即为防枚举模式——仅 /<渠道随机前缀>/... 可达,其余路径 404
      UPSTREAM_URL: "${UPSTREAM_URL:-}"
      DB_PATH: /data/audit.sqlite
      # 必填:.env 或 shell 中未设置 ADMIN_KEY 时 compose 启动直接报错(fail-fast),
      # 避免"容器能起但控制台登不上"。生成:openssl rand -base64 32
      ADMIN_KEY: "${ADMIN_KEY:?请在仓库根 .env 或 shell 环境设置 ADMIN_KEY}"
      # 可选:固定占位符派生密钥(重启/多副本间占位符映射一致,上游 Prompt Cache 前缀稳定);
      # 不在 .env 设置则每次启动随机生成
      PRIVACY_SUFFIX_SECRET: "${PRIVACY_SUFFIX_SECRET:-}"
      # 可选:管理面来源校验(反代改写 Host 时需 TRUST_PROXY=1;详见 README 运行时配置)
      TRUST_PROXY: "${TRUST_PROXY:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      DISABLE_ORIGIN_CHECK: "${DISABLE_ORIGIN_CHECK:-}"
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
