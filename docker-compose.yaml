services:
  privacy-proxy:
    image: ghcr.io/wangxinleo/private-llm-gateway:latest
    container_name: privacy-proxy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # 从仓库根 .env 自动插值(docker compose 读取同目录 .env);留空/注释掉 UPSTREAM_URL
      # 即为防枚举模式——仅 /<渠道随机前缀>/... 可达,其余路径 404
      UPSTREAM_URL: "${UPSTREAM_URL:-}"
      DB_PATH: /data/audit.sqlite
      ADMIN_KEY: "${ADMIN_KEY:-}"
      # 可选:固定占位符派生密钥(重启/多副本间占位符映射一致,上游 Prompt Cache 前缀稳定);
      # 不在 .env 设置则每次启动随机生成
      PRIVACY_SUFFIX_SECRET: "${PRIVACY_SUFFIX_SECRET:-}"
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
